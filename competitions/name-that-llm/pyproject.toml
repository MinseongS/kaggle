[project]
name = "comp-name-that-llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "kkit",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.uv]
package = false

[tool.uv.sources]
kkit = { path = "../../libs/kkit", editable = true }
