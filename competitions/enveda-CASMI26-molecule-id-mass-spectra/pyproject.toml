[project]
name = "comp-enveda-CASMI26-molecule-id-mass-spectra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kkit",
    "lightgbm>=4.7.0",
    "numba>=0.67.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "rdkit==2026.3.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[project.scripts]
casmi = "casmi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casmi"]

[tool.uv]
package = true

[tool.uv.sources]
kkit = { path = "../../libs/kkit", editable = true }
